name: Lead Emailer CI
on:
  push:
    paths: ["lead-emailer/**", ".github/workflows/lead-emailer-ci.yml"]
  pull_request:
    paths: ["lead-emailer/**", ".github/workflows/lead-emailer-ci.yml"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-emailer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lead-emailer/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: docker build -t filefast-lead-emailer:test .
  publish:
    if: startsWith(github.ref, 'refs/tags/lead-emailer-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/filefast-lead-emailer
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: lead-emailer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
