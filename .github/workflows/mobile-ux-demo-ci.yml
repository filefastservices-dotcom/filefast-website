name: Mobile UX Demo CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd mobile-ux-demo && npm install && npm run lint && npm test
      - run: cd mobile-ux-demo && docker build -t filefast-mobile-ux-demo:ci .
