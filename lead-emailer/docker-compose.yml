services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      HEALTH_PORT: 8080
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  mongo_data:
