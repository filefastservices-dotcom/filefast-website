name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep CI read-only and avoid wasting runners on superseded commits.
permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Check SEO safeguards
        run: pnpm run check:seo

      - name: Check internal routes
        run: pnpm run check:routes

      - name: Check public image size budgets
        run: pnpm run check:image-sizes

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build Next.js website
        run: pnpm run build
