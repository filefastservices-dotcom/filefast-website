name: Mobile UX Demo CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd mobile-ux-demo && npm install && npm run lint && npm test
      - run: cd mobile-ux-demo && docker build -t filefast-mobile-ux-demo:ci .
  validate-lottie:
    name: Validate Lottie sizes
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lottie size validator
        run: cd mobile-ux-demo && npm install && npm run validate:lottie
      - name: Verify public animation assets match demo source
        run: cd mobile-ux-demo && npm run validate:lottie-sync
      - name: Check demo accessibility contracts
        run: cd mobile-ux-demo && npm run check:a11y
